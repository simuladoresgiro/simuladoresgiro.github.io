# Verifica diariamente a Meta Selic (Banco Central: histórico das taxas de juros; alternativa SGS série 432) e, se houver
# alteração, atualiza "taxasReferencia" em CDI.json e TMS.json e publica no site.
name: Atualizar Selic

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3). O GitHub pode atrasar execuções agendadas em horários
    # "redondos" (minuto 00), quando há muita demanda; por isso o minuto 17.
    - cron: "17 11 * * *"    # todo dia por volta das 08:17
    - cron: "17 17 * * *"    # repetição por volta das 14:17, caso a primeira atrase ou o Banco Central esteja indisponível
  workflow_dispatch:          # permite rodar manualmente pela aba Actions

permissions:
  contents: write             # necessário para gravar CDI.json e TMS.json no repositório

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar o agendamento
        shell: bash
        run: |
          echo "Disparo: ${{ github.event_name }} | agendamento (UTC): ${{ github.event.schedule || 'manual' }}"
          echo "Início real: $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M') (Brasília)"

      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Verificar a Meta Selic e atualizar os arquivos
        shell: pwsh
        run: ./atualizar_selic.ps1

      - name: Gravar a alteração no repositório
        shell: bash
        run: |
          if git diff --quiet -- CDI.json TMS.json; then
            echo "Sem alteração da Selic."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CDI.json TMS.json
          git commit -m "Atualiza taxa de referência (Meta Selic)"
          git push
